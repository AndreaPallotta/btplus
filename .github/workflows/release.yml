name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Release MSI and Portable Package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout Code
        if: success()
        uses: actions/checkout@v4

      - name: Cache Build Dependencies
        if: success()
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/tools/
            x64/Release/
          key: ${{ runner.os }}-btplus-${{ github.sha }}

      - name: Setup MSBuild
        if: success()
        uses: microsoft/setup-msbuild@6fb027fa66c3c54c30c883e0c0a969f6ef9fec6f # v2.0.0

      - name: Build btplus.exe (Release | x64)
        if: success()
        run: |
          msbuild btplus.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /nologo

      - name: Install WiX v4
        if: success()
        run: |
          dotnet tool install --global wix --version "4.0.6"
          wix extension add WixToolset.UI.wixext/4.0.6
          wix extension add WixToolset.Util.wixext/4.0.6

      - name: Build MSI Installer
        if: success()
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if (-not $version) { $version = "1.0.0" }

          wix build `
            installer/btplus.wxs `
            installer/BtConfigDlg.wxs `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d Version=$version `
            -o "btplus-$tag.msi"

          Write-Host "Built btplus-$tag.msi"

      - name: Package Portable ZIP
        if: success()
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $dest = "dist"

          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "x64\Release\btplus.exe" "$dest\"
          Copy-Item "btplus.ini"             "$dest\"
          Copy-Item "install.ps1"            "$dest\"
          Copy-Item "README.md"              "$dest\"

          Compress-Archive -Path "$dest\*" -DestinationPath "btplus-$tag-portable.zip"
          Write-Host "Packaged btplus-$tag-portable.zip"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "btplus ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            btplus-${{ github.ref_name }}.msi
            btplus-${{ github.ref_name }}-portable.zip
