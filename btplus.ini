; btplus configuration file
; Place this file in the same directory as btplus.exe

[btplus]
; The exact Bluetooth device name to auto-connect (case-insensitive)
device=Arctis Nova 7

; How often to poll for the device as a fallback (in seconds).
; Minimum: 5. The app also reacts instantly to Bluetooth device-arrival
; events, so this is only a safety net for missed events.
poll_interval_seconds=30
